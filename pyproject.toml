[project]
name = "audiobook-generation"
version = "0.1.0"
description = "UI-driven light novel scraping and Qwen3-TTS audiobook generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
crawler = ["lightnovel-crawler>=4.14,<5", "chardet>=5,<6"]
tts = ["qwen-tts>=0.1", "soundfile>=0.12"]
tts-faster = ["faster-qwen3-tts==0.3.2", "soundfile>=0.12"]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
audiobook-server = "audiobook.main:run"
audiobook-lncrawl = "audiobook.lncrawl_compat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
